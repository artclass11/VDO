name: VDO Production Intro Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      seconds:
        description: "Intro duration"
        required: false
        default: "40"

permissions:
  contents: read

jobs:
  production-intro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install VDO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[kokoro]"

      - name: Render production intro
        env:
          VDO_TTS_PROVIDER: kokoro
          VDO_TTS_STRICT: "1"
          VDO_KOKORO_VOICE: af_bella
          VDO_KOKORO_SPEED: "0.96"
          VDO_WHISPER_MODEL: tiny
          VDO_WIDTH: "1920"
          VDO_HEIGHT: "1080"
          VDO_FPS: "30"
          VDO_VIDEO_CRF: "18"
          VDO_X264_PRESET: medium
          VDO_MUSIC_LEVEL: "0.075"
        run: |
          python main.py --intro --intro-seconds "${{ inputs.seconds || '40' }}"

      - name: Quality gate
        run: |
          python scripts/quality_check.py outputs/vdo-intro/final/vdo_intro.mp4

      - name: Upload production intro
        uses: actions/upload-artifact@v4
        with:
          name: vdo-production-intro
          path: |
            outputs/vdo-intro/final/vdo_intro.mp4
            outputs/vdo-intro/final/vdo_intro.quality.json
            outputs/vdo-intro/captions.srt
            outputs/vdo-intro/media/manifest.json
          if-no-files-found: error
