name: VDO Intro Video

on:
  push:
    paths:
      - "video/intro_topic.txt"

permissions:
  contents: read

jobs:
  generate:
    name: Generate VDO intro
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VDO_OUTPUT_DIR: ./outputs
      VDO_TTS_PROVIDER: kokoro
      VDO_TTS_STRICT: "1"
      VDO_KOKORO_VOICE: af_bella
      VDO_KOKORO_LANG: a
      VDO_KOKORO_SPEED: "0.96"
      VDO_CINEMATIC: "1"
      VDO_SHOW_SCENE_TITLES: "1"
      VDO_TRANSITION_SECONDS: "0.35"
      VDO_MUSIC_LEVEL: "0.075"
      VDO_WHISPER_MODEL: tiny
      VDO_FPS: "30"
      VDO_WIDTH: "1920"
      VDO_HEIGHT: "1080"
      VDO_VIDEO_CRF: "18"
      VDO_X264_PRESET: medium
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
          ffmpeg -version | head -n 1

      - name: Install VDO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[kokoro]"

      - name: Render production intro
        run: python main.py --intro --intro-seconds 40

      - name: Quality gate
        run: python scripts/quality_check.py outputs/vdo-intro/final/vdo_intro.mp4

      - name: Upload intro video
        uses: actions/upload-artifact@v4
        with:
          name: VDO-intro-video
          path: |
            outputs/vdo-intro/final/vdo_intro.mp4
            outputs/vdo-intro/final/vdo_intro.quality.json
            outputs/vdo-intro/captions.srt
            outputs/vdo-intro/media/manifest.json
            outputs/vdo-intro/intro.json
          if-no-files-found: error
          retention-days: 14
