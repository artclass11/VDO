[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdo-documentary"
version = "1.2.0"
description = "Local-first open-source documentary generator with professional post-production MCP workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "faster-whisper>=1.0,<2",
  "piper-tts>=1.2,<2",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
kokoro = ["kokoro>=0.9.4,<1", "soundfile>=0.12,<1"]
qwen3 = ["qwen-tts==0.1.1"]
dev = ["pytest>=8,<9"]
post = ["mcp>=2,<3", "OpenTimelineIO>=0.18,<1", "OpenTimelineIO-Plugins>=0.18.1,<1"]

[tool.setuptools]
packages = ["vdo", "vdo.providers", "vdo.post"]
py-modules = ["main", "server", "mcp_server"]

[project.scripts]
vdo = "main:cli"
vdo-mcp = "mcp_server:main"
