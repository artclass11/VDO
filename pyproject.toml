[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdo-documentary"
version = "1.0.0"
description = "Local-first open-source documentary generator from a single topic line."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "faster-whisper>=1.0,<2",
  "piper-tts>=1.2,<2",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
dev = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["vdo", "vdo.providers"]
py-modules = ["main", "server"]

[project.scripts]
vdo = "main:cli"
